  /api/v1/webhook/midtrans:
    post:
      tags:
        - Webhook
      summary: Notifikasi pembayaran Midtrans
      description: "Publik tanpa token. Midtrans sendiri mengirim JSON; server juga menerima form seperti di sini, supaya mudah dicoba. signature_key = sha512(order_id + status_code + gross_amount + ServerKey), string gross_amount harus persis sama dengan yang dikirim. Hitung di terminal dengan kunci dari .env: php artisan tinker --execute=\"echo hash('sha512','PSN-0001-1'.'200'.'600000'.config('midtrans.server_key'));\" . Tanda tangan yang sama berlaku untuk semua status order itu. capture kartu hanya mengonfirmasi bila fraud_status accept (atau kosong); challenge ditahan. refund, partial_refund, dan chargeback hanya dicatat di log aktivitas. Idempoten."
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                order_id:
                  type: string
                  example: PSN-0015-1
                status_code:
                  type: string
                  example: "200"
                gross_amount:
                  type: string
                  example: "900000.00"
                signature_key:
                  type: string
                  example: contoh-tanda-tangan
                transaction_status:
                  type: string
                  enum:
                    - settlement
                    - capture
                    - pending
                    - expire
                    - deny
                    - cancel
                    - refund
                    - partial_refund
                    - chargeback
                  example: settlement
                fraud_status:
                  type: string
                  enum:
                    - accept
                    - challenge
                    - deny
                  description: "Hanya untuk kartu (capture). Kosong dianggap accept."
                payment_type:
                  type: string
                  description: "Metode bayar, mis. qris, gopay, bank_transfer. Disimpan sebagai metode pembayaran."
                  example: qris
              required:
                - order_id
                - status_code
                - gross_amount
                - signature_key
                - transaction_status
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
              example:
                message: OK
        "403":
          description: Signature sha512 salah
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Signature tidak valid
                code: SIGNATURE_TIDAK_VALID
