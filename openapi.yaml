      description: "multipart/form-data. Ulangi field `komponen[]` untuk tiap komponen (satu baris per nilai, minimal satu). Menghitung km dan tanggal servis berikutnya (interval km + 6 bulan). `biaya_ditagih_ke_penyewa` bukan input: bila servis berasal dari pengembalian (asal_pesanan terisi) nilainya taksiran biaya kerusakan dari pengembalian itu (jumlah biaya kondisi selain baik, bukan jumlah yang sudah dibayar penyewa), selain itu 0; field ini bila dikirim diabaikan. biaya_ditanggung_perusahaan = max(0, biaya_bengkel - biaya_ditagih_ke_penyewa)."
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 4
          description: ID servis
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ServisSelesai"
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
              example:
                data:
                  status: selesai
                  km_berikutnya: 51100
                  tgl_berikutnya: "2027-05-20"
                  biaya_ditanggung_perusahaan: 0
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/admin/servis/{id}/batal:
    post:
      tags:
        - Admin - Servis
      summary: Batal servis
      description: Unit kembali tersedia.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 4
          description: ID servis
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
              example:
                data:
                  status: dibatalkan
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/admin/servis/interval:
    put:
      tags:
        - Admin - Servis
      summary: Ubah interval servis (km)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                interval_km:
                  type: integer
                  example: 5000
                  minimum: 1
              required:
                - interval_km
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
              example:
                data:
                  interval_km: 5000
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/admin/dashboard:
    get:
      tags:
        - Admin - Dashboard dan Laporan
      summary: Dashboard admin
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
              example:
                data:
                  hitungan:
                    menunggu_pembayaran: 1
                    dikonfirmasi: 2
                    berjalan: 1
                    pengajuan_pembatalan: 1
                    unit_tersedia: 4
                    unit_dalam_servis: 1
                  tugas_admin:
                    - id: 12
                      jenis: pengajuan_pembatalan
                      keterangan: Pengajuan pembatalan dari Andi
                  pengingat_servis:
                    - id_kendaraan: 3
                      plat_nomor: N 1234 AB
                      status: segera
        "401":
          $ref: "#/components/responses/Unauthorized"
      description: "`tugas_admin` berjenis: pengajuan_pembatalan, refund_transfer_admin, serahkan_unit, pengembalian_jatuh_tempo, tagihan_belum_dibayar, jaminan_siap_dikembalikan."
  /api/v1/admin/laporan:
    get:
      tags:
        - Admin - Dashboard dan Laporan
      summary: Laporan transaksi
      description: Periode bulan_ini berakhir hari ini; bulan_lalu satu bulan penuh. JSON selalu 200 walau kosong.
      security:
        - bearerAuth: []
      parameters:
        - &id009
          name: periode
          in: query
          required: false
          schema:
            type: string
          example: "7"
          description: 7 (bawaan), 30, bulan_ini, bulan_lalu
        - &id010
          name: status
          in: query
          required: false
          schema:
            type: string
          example: selesai
          description: "Opsional: satu nilai status pesanan"
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
              example:
                data:
                  periode:
                    dari: "2026-11-07"
                    sampai: "2026-11-13"
                  ringkasan:
                    total_pendapatan: 3200000
                    jumlah_transaksi: 6
                    jumlah_dibatalkan: 1
                    per_status:
                      dikonfirmasi: 2
                      berjalan: 1
                      selesai: 2
                      dibatalkan: 1
                  data:
                    - tgl_mulai: "2026-11-08"
                      nomor: PSN-1038
                      pelanggan: Budi Santoso
                      unit: Innova N 7788 IJ
                      status: selesai
                      sewa: 1800000
                      tagihan_tambahan: 180000
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/admin/laporan/pdf:
    get:
      tags:
        - Admin - Dashboard dan Laporan
      summary: Laporan transaksi PDF
      security:
        - bearerAuth: []
      parameters:
        - *id009
        - *id010
      responses:
        "200":
          description: Berhasil
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Data kosong
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Tidak ada data pada periode ini
                code: DATA_KOSONG
      description: 409 DATA_KOSONG bila tidak ada data (hanya untuk PDF).
  /api/v1/admin/sampah:
    get:
      tags:
        - Admin - Tempat Sampah
      summary: Daftar tipe dan unit di tempat sampah
      description: "Tipe dan unit yang dihapus lewat DELETE /admin/tipe/{id} atau DELETE /admin/unit/{id} (soft delete), terbaru dulu. Tiap data memuat dihapus_pada dan sisa_hari sebelum dibuang permanen oleh perintah terjadwal sampah:bersihkan (batas hari_sampah, bawaan 30; 0 berarti sudah lewat dan menunggu pembersihan berikutnya). Khusus unit: punya_riwayat menandai unit yang pernah dipakai pesanan, serah terima, atau servis; unit itu tidak pernah dibuang permanen sehingga sisa_hari-nya null dan hanya bisa dipulihkan. Data di sini tidak muncul di katalog, daftar admin, dan ketersediaan; riwayat pesanan, nota, dan laporan tetap menampilkan unitnya."
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Sampah"
              example:
                data:
                  hari_sampah: 30
                  tipe:
                    - id: 5
                      nama: Brio
                      merk: Honda
                      kursi: 5
                      bahan_bakar: bensin
                      jumlah_foto: 2
                      jumlah_unit_di_sampah: 1
                      dihapus_pada: "2026-11-20T09:15:00+07:00"
                      sisa_hari: 28
                  unit:
                    - id: 12
                      plat_nomor: N 1234 AB
                      tahun: 2022
                      warna: Putih
                      transmisi: manual
                      tipe:
                        id: 5
                        nama: Brio
                        terhapus: true
                      punya_riwayat: false
                      dihapus_pada: "2026-11-20T09:10:00+07:00"
                      sisa_hari: 28
                    - id: 13
                      plat_nomor: N 5678 CD
                      tahun: 2021
                      warna: Hitam
                      transmisi: matic
                      tipe:
                        id: 6
                        nama: Avanza
                        terhapus: false
                      punya_riwayat: true
                      dihapus_pada: "2026-11-21T10:00:00+07:00"
                      sisa_hari: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Bukan admin
  /api/v1/admin/tipe/{id}/pulihkan:
    post:
      tags:
        - Admin - Tempat Sampah
      summary: Pulihkan tipe dari tempat sampah
      description: "Mengembalikan tipe beserta foto dan tarifnya. Dicatat di log aktivitas. Bentrok keunikan tidak mungkin terjadi: selama tipe di tempat sampah, pembuatan tipe baru dengan nama + merk yang sama ditolak (TIPE_ADA_DI_SAMPAH)."
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 5
          description: ID tipe di tempat sampah
      responses:
        "200":
          description: Dipulihkan; isi sama dengan GET /admin/tipe/{id}
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Tipe tidak ada sama sekali
        "409":
          description: TIDAK_DI_SAMPAH (tipe masih aktif)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Tipe ini masih aktif, tidak ada di tempat sampah
                code: TIDAK_DI_SAMPAH
  /api/v1/admin/unit/{id}/pulihkan:
    post:
      tags:
        - Admin - Tempat Sampah
      summary: Pulihkan unit dari tempat sampah
      description: "Mengembalikan unit beserta detailnya. Hanya bila tipenya aktif; bila tipenya juga di tempat sampah, dijawab 409 UNIT_TIPE_DI_SAMPAH dan tipe harus dipulihkan dulu (POST /admin/tipe/{id}/pulihkan). Dicatat di log aktivitas."
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 12
          description: ID unit di tempat sampah
      responses:
        "200":
          description: Dipulihkan; isi sama dengan GET /admin/unit/{id}
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unit tidak ada sama sekali
        "409":
          description: TIDAK_DI_SAMPAH (unit masih aktif) atau UNIT_TIPE_DI_SAMPAH (pulihkan tipenya dulu)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Tipe unit ini ada di tempat sampah. Pulihkan tipe Brio dulu, lalu pulihkan unit.
                code: UNIT_TIPE_DI_SAMPAH
                detail:
                  jenis: tipe
                  id: 5
                  nama: Brio
                  merk: Honda
  /api/v1/admin/sampah/tipe/{id}:
    delete:
      tags:
        - Admin - Tempat Sampah
      summary: Hapus permanen satu tipe di tempat sampah
      description: "TIDAK bisa dibatalkan. Wajib konfirmasi=true (query atau body); tanpa itu 409 KONFIRMASI_DIPERLUKAN dan tidak ada yang berubah (respons memuat detail.unit_ikut_dihapus dan detail.foto_dihapus sebagai gambaran). Hanya untuk tipe yang sudah di tempat sampah: tipe aktif dijawab 409 TIDAK_DI_SAMPAH, tidak ada sama sekali 404. Foto (baris dan berkas) ikut terhapus, dan unit milik tipe itu yang juga di tempat sampah ikut dibuang permanen. Dicatat di log aktivitas. Dipakai untuk pilihan 'hapus permanen lalu buat baru' setelah TIPE_ADA_DI_SAMPAH."
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 5
          description: ID tipe di tempat sampah
        - name: konfirmasi
          in: query
          required: true
          schema:
            type: boolean
          description: Harus true
      responses:
        "200":
          description: Dihapus permanen
          content:
            application/json:
              schema:
                type: object
              example:
                data:
                  id: 5
                  unit_ikut_dihapus: 1
                  foto_dihapus: 2
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Tipe tidak ada sama sekali
        "409":
          description: KONFIRMASI_DIPERLUKAN, TIDAK_DI_SAMPAH, atau TIPE_MASIH_DIPAKAI (bila data tidak konsisten dan masih ada unit aktif atau pesanan)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Hapus permanen tipe Brio tidak bisa dibatalkan. Kirim ulang dengan konfirmasi=true.
                code: KONFIRMASI_DIPERLUKAN
                detail:
                  jenis: tipe
                  id: 5
                  nama: Brio
                  merk: Honda
                  unit_ikut_dihapus: 1
                  foto_dihapus: 2
  /api/v1/admin/sampah/unit/{id}:
    delete:
      tags:
        - Admin - Tempat Sampah
      summary: Hapus permanen satu unit di tempat sampah
      description: "TIDAK bisa dibatalkan. Wajib konfirmasi=true (query atau body); tanpa itu 409 KONFIRMASI_DIPERLUKAN. Hanya untuk unit yang sudah di tempat sampah dan TANPA riwayat: unit aktif dijawab 409 TIDAK_DI_SAMPAH, tidak ada sama sekali 404, unit berriwayat 409 UNIT_PUNYA_RIWAYAT (dicek sebelum konfirmasi; sarannya memulihkan unit). Detail unit ikut terhapus. Dicatat di log aktivitas. Dipakai untuk pilihan 'hapus permanen lalu buat baru' setelah UNIT_ADA_DI_SAMPAH."
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 12
          description: ID unit di tempat sampah
        - name: konfirmasi
          in: query
          required: true
          schema:
            type: boolean
          description: Harus true
      responses:
        "200":
          description: Dihapus permanen
          content:
            application/json:
              schema:
                type: object
              example:
                data:
                  id: 12
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unit tidak ada sama sekali
        "409":
          description: "KONFIRMASI_DIPERLUKAN, TIDAK_DI_SAMPAH, atau UNIT_PUNYA_RIWAYAT (unit pernah dipakai pesanan, serah terima, atau servis: tidak pernah dibuang permanen, pulihkan saja)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                tidak_di_sampah:
                  value:
                    message: Unit ini masih aktif, tidak ada di tempat sampah
                    code: TIDAK_DI_SAMPAH
                unit_punya_riwayat:
                  value:
                    message: Unit N 5678 CD punya riwayat pesanan atau servis sehingga tidak bisa dibuang permanen. Pulihkan saja unit ini.
                    code: UNIT_PUNYA_RIWAYAT
                    detail:
                      jenis: unit
                      id: 13
                      plat_nomor: N 5678 CD
                      punya_riwayat: true
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum token
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
          example: Mobil sudah dipesan pada tanggal tersebut
        code:
          type: string
          example: UNIT_TIDAK_TERSEDIA
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            email:
              - Email sudah terdaftar
        detail:
          $ref: "#/components/schemas/SampahDetail"
    Meta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 10
        total:
          type: integer
          example: 25
    Aksi:
      type: object
      properties:
        bisa_bayar:
          type: boolean
          example: false
        bisa_batalkan:
          type: boolean
          example: false
        bisa_ajukan_pembatalan:
          type: boolean
          example: true
        bisa_review:
          type: boolean
          example: false
        bisa_unduh_nota:
          type: boolean
          example: true
        bisa_perpanjang:
          type: boolean
          example: false
        bisa_pesan_lagi:
          type: boolean
          example: false
      description: 7 kunci pada pesanan milik user
    RegisterRequest:
      type: object
      properties:
        nama:
          type: string
          example: Budi Santoso
          maxLength: 100
        email:
          type: string
          example: budi@email.com
          format: email
        no_hp:
          type: string
          example: "081234567890"
          pattern: ^(\+62|62|0)8[1-9][0-9]{6,11}$
        provinsi:
          type: string
          example: Jawa Timur
        kota:
          type: string
          example: Kota Malang
        password:
          type: string
          example: rahasia123
          minLength: 8
          description: Minimal 8 karakter dan mengandung angka
        password_confirmation:
          type: string
          example: rahasia123
      required:
        - nama
        - email
        - no_hp
        - provinsi
        - kota
        - password
        - password_confirmation
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          example: budi@email.com
          format: email
        password:
          type: string
          example: rahasia123
      required:
        - email
        - password
    PemesananBuat:
      type: object
      properties:
        id_tipe:
          type: integer
          example: 1
        jenis_sewa:
          type: string
          enum:
            - dengan_sopir
            - lepas_kunci
          example: lepas_kunci
        tgl_mulai:
          type: string
          example: "2026-12-10"
          format: date
          description: Paling cepat besok, paling jauh 30 hari dari hari ini
        durasi:
          type: integer
          example: 3
          minimum: 1
          maximum: 30
        jam_serah:
          type: string
          example: 09:00
          description: "Lepas kunci: 07:00 sampai 21:00. Dengan sopir: bebas"
        metode_ambil:
          type: string
          enum:
            - ambil_di_kantor
            - diantar
          example: diantar
          description: Hanya untuk lepas_kunci
        lokasi_jemput:
          type: string
          example: Jl. Veteran No. 5, Malang
          description: Wajib untuk dengan_sopir; untuk lepas_kunci hanya jika diantar
        tujuan:
          type: string
          example: Malang, Batu
          description: Wajib untuk dengan_sopir, teks bebas
        catatan:
          type: string
          example: Mohon unit bersih
        setuju_syarat:
          type: boolean
          example: true
        transmisi:
          type: string
          enum:
            - manual
            - matic
          example: manual
          description: Wajib untuk lepas_kunci
        setuju_syarat_jaminan:
          type: boolean
          example: true
          description: Wajib untuk lepas_kunci
      required:
        - id_tipe
        - jenis_sewa
        - tgl_mulai
        - durasi
        - jam_serah
        - setuju_syarat
    AjukanPembatalan:
      type: object
      properties:
        alasan:
          type: string
          example: Jadwal berubah
        bank:
          type: string
          example: BCA
          description: Wajib untuk pembayaran virtual account
        no_rekening:
          type: string
          example: "1234567890"
        nama_rekening:
          type: string
          example: Budi Santoso
      required:
        - alasan
    ReviewBuat:
      type: object
      properties:
        rating:
          type: integer
          example: 5
          minimum: 1
          maximum: 5
        komentar:
          type: string
          example: Mobil bersih dan nyaman
          maxLength: 500
      required:
        - rating
    SerahTerimaForm:
      type: object
      description: "multipart/form-data. Untuk lepas_kunci: jaminan[dokumen_tambahan] (jenis dokumen, teks) dan foto jaminan per item di foto_jaminan[item] (berkas jpg atau png, maks 2 MB). Item wajib menurut domisili berlaku: malang_raya = ktp_asli, sim_c_asli, dokumen_tambahan, motor_stnk; luar_malang_raya = ktp_asli, sim_c_asli, dokumen_tambahan, booking_transportasi, booking_hotel. Untuk dengan_sopir hanya id_kendaraan (dan catatan, foto kondisi) yang dipakai. Nama field foto harus memakai kurung siku, mis. foto_jaminan[ktp_asli]."
      properties:
        id_kendaraan:
          type: integer
          example: 3
          description: Harus ada di daftar unit dari endpoint unit-tersedia
        catatan_kondisi:
          type: string
          example: Ada baret halus di kap
        no_identitas:
          type: string
          example: "3573010000000009"
          description: Wajib untuk lepas_kunci
        odometer_awal:
          type: integer
          example: 45800
          description: Wajib untuk lepas_kunci
        bbm_awal:
          type: string
          enum:
            - penuh
            - tiga_perempat
            - setengah
            - seperempat
            - hampir_kosong
          example: penuh
          description: Wajib untuk lepas_kunci
        domisili_disesuaikan:
          type: string
          enum:
            - malang_raya
            - luar_malang_raya
          description: Isi bila KTP berbeda dengan domisili pesanan; menentukan foto jaminan yang wajib
        jaminan[dokumen_tambahan]:
          type: string
          enum:
            - ktm
            - kk
            - npwp
            - bpjs
            - paspor
          example: kk
          description: Jenis dokumen tambahan. Wajib untuk lepas_kunci
        foto_jaminan[ktp_asli]:
          type: string
          format: binary
          description: "Wajib untuk lepas_kunci. jpg atau png, maks 2 MB."
        foto_jaminan[sim_c_asli]:
          type: string
          format: binary
          description: "Wajib untuk lepas_kunci. jpg atau png, maks 2 MB."
        foto_jaminan[dokumen_tambahan]:
          type: string
          format: binary
          description: "Wajib untuk lepas_kunci (foto dokumen yang dipilih di jaminan[dokumen_tambahan]). jpg atau png, maks 2 MB."
        foto_jaminan[motor_stnk]:
          type: string
          format: binary
          description: "Wajib bila domisili malang_raya. jpg atau png, maks 2 MB."
        foto_jaminan[booking_transportasi]:
          type: string
          format: binary
          description: "Wajib bila domisili luar_malang_raya. jpg atau png, maks 2 MB."
        foto_jaminan[booking_hotel]:
          type: string
          format: binary
          description: "Wajib bila domisili luar_malang_raya. jpg atau png, maks 2 MB."
        foto_kondisi[]:
          type: array
          items:
            type: string
            format: binary
          maxItems: 10
          description: "Opsional. Berkas gambar, maksimal 5 MB per berkas dan 10 berkas. Hapus item bawaan Swagger di kolom ini bila tidak mengunggah foto."
      required:
        - id_kendaraan
    PengembalianForm:
      type: object
      description: "multipart/form-data, diratakan agar mudah diisi di Swagger. Wajib 8 bagian mobil (depan, belakang, sisi_kiri, sisi_kanan, atap, kaca_lampu, ban_velg, interior) di kondisi[bagian]; bagian yang bukan baik wajib punya biaya[bagian] dan foto[bagian]. Kolom lepas kunci (odometer_akhir, bbm_akhir, biaya_kekurangan_bbm, kebersihan) hanya wajib untuk lepas_kunci. Nama field memakai kurung siku. Kosongkan (hapus) kolom foto yang tidak dipakai."
      properties:
        tgl_kembali:
          type: string
          format: date
          example: "2026-12-12"
        jam_kembali:
          type: string
          example: "18:30"
        odometer_akhir:
          type: integer
          example: 46100
          description: Wajib untuk lepas_kunci
        bbm_akhir:
          type: string
          enum:
            - penuh
            - tiga_perempat
            - setengah
            - seperempat
            - hampir_kosong
          example: penuh
          description: Wajib untuk lepas_kunci
        biaya_kekurangan_bbm:
          type: integer
          example: 0
          description: Wajib untuk lepas_kunci
        kebersihan:
          type: string
          enum:
            - bersih
            - kotor_biasa
            - sangat_kotor
          example: bersih
          description: Wajib untuk lepas_kunci
        kondisi[depan]:
          type: string
          enum:
            - baik
            - lecet
            - penyok
            - retak
            - rusak
          example: baik
          description: "Wajib. Bagian depan."
        kondisi[belakang]:
          type: string
          enum:
            - baik
            - lecet
            - penyok
            - retak
            - rusak
          example: baik
          description: "Wajib. Bagian belakang."
        kondisi[sisi_kiri]:
          type: string
          enum:
            - baik
            - lecet
            - penyok
            - retak
            - rusak
          example: baik
          description: "Wajib. Bagian sisi kiri."
        kondisi[sisi_kanan]:
          type: string
          enum:
            - baik
            - lecet
            - penyok
            - retak
            - rusak
          example: baik
          description: "Wajib. Bagian sisi kanan."
        kondisi[atap]:
          type: string
          enum:
            - baik
            - lecet
            - penyok
            - retak
            - rusak
          example: baik
          description: "Wajib. Bagian atap."
        kondisi[kaca_lampu]:
          type: string
          enum:
            - baik
            - lecet
            - penyok
            - retak
            - rusak
          example: baik
          description: "Wajib. Bagian kaca lampu."
        kondisi[ban_velg]:
          type: string
          enum:
            - baik
            - lecet
            - penyok
            - retak
            - rusak
          example: baik
          description: "Wajib. Bagian ban velg."
        kondisi[interior]:
          type: string
          enum:
            - baik
            - lecet
            - penyok
            - retak
            - rusak
          example: baik
          description: "Wajib. Bagian interior."
        biaya[depan]:
          type: integer
          example: 0
          description: "Biaya perbaikan bagian depan. Wajib bila kondisi[depan] bukan baik; diabaikan bila baik."
        biaya[belakang]:
          type: integer
          example: 0
          description: "Biaya perbaikan bagian belakang. Wajib bila kondisi[belakang] bukan baik; diabaikan bila baik."
        biaya[sisi_kiri]:
          type: integer
          example: 0
          description: "Biaya perbaikan bagian sisi kiri. Wajib bila kondisi[sisi_kiri] bukan baik; diabaikan bila baik."
        biaya[sisi_kanan]:
          type: integer
          example: 0
          description: "Biaya perbaikan bagian sisi kanan. Wajib bila kondisi[sisi_kanan] bukan baik; diabaikan bila baik."
        biaya[atap]:
          type: integer
          example: 0
          description: "Biaya perbaikan bagian atap. Wajib bila kondisi[atap] bukan baik; diabaikan bila baik."
        biaya[kaca_lampu]:
          type: integer
          example: 0
          description: "Biaya perbaikan bagian kaca lampu. Wajib bila kondisi[kaca_lampu] bukan baik; diabaikan bila baik."
        biaya[ban_velg]:
          type: integer
          example: 0
          description: "Biaya perbaikan bagian ban velg. Wajib bila kondisi[ban_velg] bukan baik; diabaikan bila baik."
        biaya[interior]:
          type: integer
          example: 0
          description: "Biaya perbaikan bagian interior. Wajib bila kondisi[interior] bukan baik; diabaikan bila baik."
        keterangan[depan]:
          type: string
          description: "Opsional, maks 255 karakter."
        keterangan[belakang]:
          type: string
          description: "Opsional, maks 255 karakter."
        keterangan[sisi_kiri]:
          type: string
          description: "Opsional, maks 255 karakter."
        keterangan[sisi_kanan]:
          type: string
          description: "Opsional, maks 255 karakter."
        keterangan[atap]:
          type: string
          description: "Opsional, maks 255 karakter."
        keterangan[kaca_lampu]:
          type: string
          description: "Opsional, maks 255 karakter."
        keterangan[ban_velg]:
          type: string
          description: "Opsional, maks 255 karakter."
        keterangan[interior]:
          type: string
          description: "Opsional, maks 255 karakter."
        foto[depan]:
          type: string
          format: binary
          description: "Foto bagian depan. Wajib bila kondisi[depan] bukan baik (tidak diminta di preview). Gambar, maks 5 MB, satu berkas per bagian. Tersimpan di penyimpanan privat dan terkait ke bagiannya."
        foto[belakang]:
          type: string
          format: binary
          description: "Foto bagian belakang. Wajib bila kondisi[belakang] bukan baik (tidak diminta di preview). Gambar, maks 5 MB, satu berkas per bagian. Tersimpan di penyimpanan privat dan terkait ke bagiannya."
        foto[sisi_kiri]:
          type: string
          format: binary
          description: "Foto bagian sisi kiri. Wajib bila kondisi[sisi_kiri] bukan baik (tidak diminta di preview). Gambar, maks 5 MB, satu berkas per bagian. Tersimpan di penyimpanan privat dan terkait ke bagiannya."
        foto[sisi_kanan]:
          type: string
          format: binary
          description: "Foto bagian sisi kanan. Wajib bila kondisi[sisi_kanan] bukan baik (tidak diminta di preview). Gambar, maks 5 MB, satu berkas per bagian. Tersimpan di penyimpanan privat dan terkait ke bagiannya."
        foto[atap]:
          type: string
          format: binary
          description: "Foto bagian atap. Wajib bila kondisi[atap] bukan baik (tidak diminta di preview). Gambar, maks 5 MB, satu berkas per bagian. Tersimpan di penyimpanan privat dan terkait ke bagiannya."
        foto[kaca_lampu]:
          type: string
          format: binary
          description: "Foto bagian kaca lampu. Wajib bila kondisi[kaca_lampu] bukan baik (tidak diminta di preview). Gambar, maks 5 MB, satu berkas per bagian. Tersimpan di penyimpanan privat dan terkait ke bagiannya."
        foto[ban_velg]:
          type: string
          format: binary
          description: "Foto bagian ban velg. Wajib bila kondisi[ban_velg] bukan baik (tidak diminta di preview). Gambar, maks 5 MB, satu berkas per bagian. Tersimpan di penyimpanan privat dan terkait ke bagiannya."
        foto[interior]:
          type: string
          format: binary
          description: "Foto bagian interior. Wajib bila kondisi[interior] bukan baik (tidak diminta di preview). Gambar, maks 5 MB, satu berkas per bagian. Tersimpan di penyimpanan privat dan terkait ke bagiannya."
        biaya_tambahan[cuci]:
          type: integer
          description: "Nominal rupiah untuk cuci. Kosong atau 0 berarti tidak ada. Satu isian per jenis."
        biaya_tambahan[kelengkapan_hilang]:
          type: integer
          description: "Nominal rupiah untuk kelengkapan hilang. Kosong atau 0 berarti tidak ada. Satu isian per jenis."
        biaya_tambahan[biaya_antar]:
          type: integer
          description: "Nominal rupiah untuk biaya antar. Kosong atau 0 berarti tidak ada. Satu isian per jenis."
        biaya_tambahan[lainnya]:
          type: integer
          description: "Nominal rupiah untuk lainnya. Kosong atau 0 berarti tidak ada. Satu isian per jenis."
        keterangan_tambahan[cuci]:
          type: string
          description: "Opsional, maks 255 karakter."
        keterangan_tambahan[kelengkapan_hilang]:
          type: string
          description: "Opsional, maks 255 karakter."
        keterangan_tambahan[biaya_antar]:
          type: string
          description: "Opsional, maks 255 karakter."
        keterangan_tambahan[lainnya]:
          type: string
          description: "Opsional, maks 255 karakter."
        disetujui_penyewa:
          type: boolean
          example: true
          description: Wajib true (tidak diminta di preview). Dikirim sebagai teks true atau false.
        catatan_admin:
          type: string
        status_pembayaran_tagihan:
          type: string
          enum:
            - belum_dibayar
            - tunai
            - transfer
          example: tunai
        unit_perlu_servis:
          type: boolean
          example: false
        servis[tingkat]:
          type: string
          enum:
            - ringan
            - sedang
            - perlu_bengkel
          description: Wajib bila unit_perlu_servis true
        servis[keperluan]:
          type: string
          description: Wajib bila unit_perlu_servis true (maks 100 karakter)
      required:
        - tgl_kembali
        - jam_kembali
        - kondisi[depan]
        - kondisi[belakang]
        - kondisi[sisi_kiri]
        - kondisi[sisi_kanan]
        - kondisi[atap]
        - kondisi[kaca_lampu]
        - kondisi[ban_velg]
        - kondisi[interior]
        - disetujui_penyewa
    TipeInput:
      type: object
      properties:
        nama:
          type: string
          example: Brio
          description: "Dirapikan otomatis (mis. iNNOva rEBORN menjadi Innova Reborn). Bersama merk harus unik tanpa peka huruf besar kecil."
        merk:
          type: string
          example: Honda
          description: "Dirapikan otomatis (mis. tOYOta menjadi Toyota). Bersama nama harus unik tanpa peka huruf besar kecil."
        kursi:
          type: integer
          example: 5
        bahan_bakar:
          type: string
          enum:
            - bensin
            - diesel
          example: bensin
        harga_sopir_per_hari:
          type: integer
          example: 650000
          minimum: 1
        harga_lepas_kunci_manual:
          type: integer
          example: 300000
          minimum: 1
        harga_lepas_kunci_matic:
          type: integer
          example: 350000
          minimum: 1
        foto[]:
          type: array
          items:
            type: string
            format: binary
          maxItems: 3
          description: "jpg atau png, maks 2 MB per berkas. Maksimal 3 berkas per permintaan dan total 3 foto per tipe (saat ubah, foto ditambahkan ke yang sudah ada). Nama field harus foto[] (dengan kurung siku) agar dibaca PHP sebagai daftar."
      required:
        - nama
        - merk
        - kursi
        - bahan_bakar
      description: 'Tarif minimal 1 (0 sama dengan tidak ditawarkan). Foto: pilih berkas gambar, maksimal 3. Kalau tidak mengunggah foto, hapus item "string" bawaan Swagger di kolom foto.'
    UnitForm:
      type: object
      description: "Form untuk POST /admin/unit (multipart/form-data) dan PUT /admin/unit/{id} (x-www-form-urlencoded). Objek detail diratakan dengan kurung siku. Kolom opsional boleh dikosongkan."
      properties:
        id_tipe:
          type: integer
          example: 1
        plat_nomor:
          type: string
          example: N 1234 AB
          description: "Dirapikan otomatis (huruf besar, satu spasi antar bagian, mis. n1234ab menjadi N 1234 AB). Pola umum: 1-2 huruf, 1-4 angka, 0-3 huruf; selain itu 422. Unik tanpa peka huruf besar kecil dan tanpa spasi (N1234AB sama dengan n 1234 ab); yang sudah dipakai unit lain dijawab 422 \"Plat nomor sudah dipakai unit lain.\"."
        tahun:
          type: integer
          example: 2022
        warna:
          type: string
          example: Putih
        transmisi:
          type: string
          enum:
            - manual
            - matic
          example: manual
        km_terakhir:
          type: integer
          example: 45800
          description: Opsional; kosong = 0
        detail[nama_pemilik]:
          type: string
          example: PT GantengnyaJatim
          description: Opsional
        detail[status_kepemilikan]:
          type: string
          enum:
            - milik_perusahaan
            - titipan
          example: milik_perusahaan
          description: Opsional; kosong = milik_perusahaan
        detail[no_rangka]:
          type: string
          example: MH4001
          description: "WAJIB. Unik tanpa peka huruf besar kecil dan tanpa spasi di tepi. Kosong: 422 \"No rangka wajib diisi.\"."
        detail[no_mesin]:
          type: string
          example: L15001
          description: "WAJIB. Unik tanpa peka huruf besar kecil dan tanpa spasi di tepi. Kosong: 422 \"No mesin wajib diisi.\"."
        detail[no_bpkb]:
          type: string
          example: BPKB-001
          description: Opsional; bila diisi harus unik
        detail[masa_berlaku_stnk]:
          type: string
          format: date
          example: "2027-03-15"
          description: Opsional, format YYYY-MM-DD
        detail[catatan]:
          type: string
          description: Opsional
      required:
        - id_tipe
        - plat_nomor
        - tahun
        - warna
        - transmisi
        - detail[no_rangka]
        - detail[no_mesin]
    ServisBuat:
      type: object
      properties:
        id_kendaraan:
          type: integer
          example: 3
        jenis_servis:
          type: string
          example: Servis berkala
        tingkat_servis:
          type: string
          enum:
            - ringan
            - sedang
            - perlu_bengkel
          example: ringan
        tgl_perawatan:
          type: string
          example: "2026-11-20"
          format: date
        bengkel:
          type: string
          example: Bengkel Rekanan
        km_saat_ini:
          type: integer
          example: 46100
          description: Opsional
        catatan:
          type: string
          example: ""
          description: Opsional
        konfirmasi:
          type: boolean
          example: false
          description: Dikirim sebagai teks true atau false. true untuk tetap mencatat setelah peringatan pesanan terdampak
      required:
        - id_kendaraan
        - jenis_servis
        - tingkat_servis
        - tgl_perawatan
        - bengkel
      description: "multipart/form-data untuk POST /admin/servis. km_saat_ini, catatan, dan konfirmasi opsional dan boleh dikosongkan."
    GantiPassword:
      type: object
      properties:
        password_lama:
          type: string
          example: lama12345
        password_baru:
          type: string
          minLength: 8
          example: baru12345
          description: Minimal 8 karakter dan ada angka
        konfirmasi:
          type: string
          example: baru12345
          description: Harus sama dengan password_baru
      required:
        - password_lama
        - password_baru
        - konfirmasi
    ProfilForm:
      type: object
      description: "multipart/form-data. Semua field opsional (tidak ada yang wajib): kirim hanya yang ingin diubah. Admin hanya memakai nama (dan foto). Email, no_identitas, dan role diabaikan. Foto: tanpa field foto, foto lama tetap; foto baru mengganti foto lama (berkas lama dihapus); hapus_foto=true mengosongkan foto. Bila foto dan hapus_foto=true dikirim bersamaan, foto yang berlaku."
      properties:
        nama:
          type: string
          maxLength: 100
          example: Budi Santoso
        no_hp:
          type: string
          example: "081234567890"
        provinsi:
          type: string
          example: Jawa Timur
        kota:
          type: string
          example: Kota Malang
        foto:
          type: string
          format: binary
          description: "Opsional. jpg, jpeg, png, atau webp, maks 2 MB. Satu foto per akun: mengganti foto lama."
        hapus_foto:
          type: boolean
          default: false
          description: "Opsional. true = hapus foto profil (menjadi null) dan berkasnya dihapus dari disk."
    ServisSelesai:
      type: object
      properties:
        komponen[]:
          type: array
          items:
            type: string
          minItems: 1
          description: Ulangi field komponen[] untuk tiap komponen
          example:
            - Oli mesin dan filter
            - Rem
        biaya_bengkel:
          type: integer
          minimum: 0
          example: 850000
        km_saat_ini:
          type: integer
          minimum: 0
          description: Tidak boleh lebih kecil dari km terakhir unit.
          example: 46100
      required:
        - komponen[]
        - biaya_bengkel
        - km_saat_ini
      example:
        komponen[]:
          - Oli mesin dan filter
          - Rem
        biaya_bengkel: 850000
        km_saat_ini: 46100
    SampahDetail:
      type: object
      description: "Data lama yang bentrok di tempat sampah, untuk pop-up tiga pilihan (pulihkan, hapus permanen lalu buat baru, atau batal). Dipakai pada code TIPE_ADA_DI_SAMPAH, UNIT_ADA_DI_SAMPAH, UNIT_TIPE_DI_SAMPAH, dan KONFIRMASI_DIPERLUKAN. Bila beberapa unit di tempat sampah bentrok sekaligus, yang dilaporkan unit dengan id terkecil; selesaikan, lalu kirim ulang untuk melihat berikutnya. Untuk unit, punya_riwayat=true berarti frontend hanya menawarkan pulihkan (tanpa tombol hapus permanen) dan sisa_hari null."
      properties:
        jenis:
          type: string
          enum: [tipe, unit]
        id:
          type: integer
          example: 5
        nama:
          type: string
          description: Hanya untuk tipe
          example: Brio
        merk:
          type: string
          description: Hanya untuk tipe
          example: Honda
        plat_nomor:
          type: string
          description: Hanya untuk unit
          example: N 1234 AB
        kolom_bentrok:
          type: array
          description: "Tipe: nama dan merk. Unit: satu atau lebih dari plat_nomor, no_rangka, no_mesin, no_bpkb"
          items:
            type: string
          example: [plat_nomor, no_rangka]
        dihapus_pada:
          type: string
          format: date-time
          example: "2026-11-20T09:15:00+07:00"
        sisa_hari:
          type: integer
          nullable: true
          description: Hari sebelum dibuang permanen otomatis (0 bila sudah lewat batas); null untuk unit berriwayat
          example: 28
        punya_riwayat:
          type: boolean
          description: Hanya untuk unit. true bila unit pernah dipakai pesanan, serah terima, atau servis (tidak bisa dihapus permanen)
          example: false
    Sampah:
      type: object
      properties:
        hari_sampah:
          type: integer
          description: Batas hari di tempat sampah (config rental.hari_sampah)
          example: 30
        tipe:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              nama:
                type: string
              merk:
                type: string
              kursi:
                type: integer
              bahan_bakar:
                type: string
              jumlah_foto:
                type: integer
              jumlah_unit_di_sampah:
                type: integer
              dihapus_pada:
                type: string
                format: date-time
              sisa_hari:
                type: integer
        unit:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              plat_nomor:
                type: string
              tahun:
                type: integer
              warna:
                type: string
              transmisi:
                type: string
              tipe:
                type: object
                properties:
                  id:
                    type: integer
                  nama:
                    type: string
                  terhapus:
                    type: boolean
                    description: true bila tipenya juga di tempat sampah (pulihkan tipe dulu)
              punya_riwayat:
                type: boolean
                description: true bila unit pernah dipakai pesanan, serah terima, atau servis; tidak pernah dibuang permanen
              dihapus_pada:
                type: string
                format: date-time
              sisa_hari:
                type: integer
                nullable: true
                description: Hari sebelum dibuang permanen; null bila punya_riwayat
  responses:
    Unauthorized:
      description: Belum login atau token tidak valid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: Belum login
            code: BELUM_LOGIN
    TerlaluBanyak:
      description: Lebih dari 5 percobaan per menit
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: Terlalu banyak percobaan, coba lagi nanti
            code: TERLALU_BANYAK_PERCOBAAN
    Validation:
      description: Validasi gagal
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: Data yang dikirim tidak valid
            code: VALIDASI_GAGAL
            errors:
              email:
                - Email sudah terdaftar
