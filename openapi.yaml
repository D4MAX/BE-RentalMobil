                  foto: 3
                  jumlah_unit: 3
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Validasi gagal, termasuk foto yang membuat total melebihi 3; atau code TIPE_SUDAH_ADA bila kombinasi nama + merk sudah ada
          content:
            application/json:
