openapi: 3.0.3
info:
  title: API Sistem Rental Mobil
  version: 1.5.0
  description:
    "Spesifikasi untuk menguji backend Laravel lewat Swagger UI. Sesuai kode: **semua rute di dokumen ini sudah ada**.


    **Cara pakai:** jalankan `php artisan serve`, buka `/docs`, pilih server Laravel, panggil `POST /auth/login`, salin `data.token`, klik **Authorize** dan tempel token (tanpa kata `Bearer`).


    - Admin dengan kata sandi sementara (`wajib_ganti_password: true`) hanya bisa memanggil `PUT /profil/password` dan logout.

    - Semua tanggal dan jam memakai zona WIB.

    - Admin tidak punya endpoint pembatalan; admin hanya menyetujui atau menolak pengajuan pelanggan.

    "
servers:
  - url: /
    description: Server yang sedang membuka /docs (lokal atau ngrok)
  - url: http://127.0.0.1:8000
    description: Laravel (lokal)
  - url: http://127.0.0.1:4010
    description: Mock Prism (opsional)
tags:
  - name: Auth
    description: Daftar, verifikasi email, login, kata sandi
  - name: Profil
    description: Profil user
  - name: Katalog
    description: "Publik: tipe, tarif, sisa unit"
  - name: Pemesanan (user)
    description: Pesanan milik user
  - name: Webhook
    description: Notifikasi Midtrans
  - name: Admin - Pemesanan
    description: Daftar, detail, serah terima, pengembalian, pembatalan
  - name: Admin - Tipe
    description: Kelola tipe kendaraan
  - name: Admin - Unit
    description: Kelola unit dan detail kendaraan
  - name: Admin - Tempat Sampah
    description: Soft delete tipe dan unit, pemulihan, dan hapus permanen
  - name: Admin - Servis
    description: Servis berkala
  - name: Admin - Dashboard dan Laporan
    description: Dashboard dan laporan
paths:
  /api/v1/auth/register:
    post:
      tags:
        - Auth
      summary: Register user
      description: "multipart/form-data, tiap field satu kolom (tidak ada field file). Akun dibuat belum terverifikasi; tautan verifikasi dikirim lewat email (12 jam). Tidak ada token. Email yang sudah dipakai dijawab 422. Akun belum terverifikasi baru bisa ditimpa pendaftaran ulang setelah 60 menit sejak dibuat dan sebelum 30 hari; di dalam 60 menit pertama pendaftaran ulang ditolak 422."
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Akun dibuat
          content:
            application/json:
              schema:
                type: object
              example:
                data:
                  id: 1
                  nama: Budi Santoso
                  email: budi@email.com
                message: Cek email Anda untuk verifikasi
        "422":
          $ref: "#/components/responses/Validation"
        "429":
          description: Lebih dari 10 pendaftaran per jam dari satu IP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Terlalu banyak percobaan, coba lagi nanti
                code: TERLALU_BANYAK_PERCOBAAN
  /api/v1/auth/verifikasi-email:
    post:
      tags:
        - Auth
      summary: Verifikasi email lewat tautan
      description: Token sekali pakai, berlaku 12 jam.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                token:
                  type: string
                  example: abc123token
              required:
                - token
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
              example:
                message: Email terverifikasi
        "422":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Token tidak valid atau kedaluwarsa
                code: TOKEN_TIDAK_VALID
  /api/v1/auth/kirim-ulang-verifikasi:
    post:
      tags:
        - Auth
      summary: Kirim ulang tautan verifikasi
      description: "Maksimal 3 kali per jam. Email tidak terdaftar dijawab 404, akun yang sudah terverifikasi dijawab 409 EMAIL_SUDAH_TERVERIFIKASI (tidak ada email yang dikirim; arahkan pengguna ke Login). Gagal kirim email (SMTP) tetap dijawab 200 dan hanya tercatat di log server."
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: budi@email.com
              required:
                - email
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
              example:
                message: Tautan verifikasi dikirim
        "404":
          description: Email tidak ada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Email tidak terdaftar
                code: EMAIL_TIDAK_TERDAFTAR
        "409":
          description: Email sudah terverifikasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Email sudah terverifikasi, silakan login
                code: EMAIL_SUDAH_TERVERIFIKASI
        "429":
          description: Lebih dari 3 kali per jam
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Terlalu banyak percobaan
                code: TERLALU_BANYAK
  /api/v1/auth/login:
    post:
      tags:
        - Auth
      summary: Login
      description: "Satu endpoint untuk semua peran. Masa berlaku token: user 60 menit, admin 30 menit (TOKEN_USER_MENIT dan TOKEN_ADMIN_MENIT di .env). Masa berlaku diperpanjang selama ada aktivitas (idle timeout, tanpa refresh token): permintaan terautentikasi yang BERHASIL memperpanjang token sampai masa berlaku penuh lagi, tetapi hanya bila sisa waktunya tinggal separuh atau kurang (hemat query). Permintaan yang gagal (4xx, 5xx) dan token yang sudah kedaluwarsa tidak memperpanjang. Token kedaluwarsa dijawab 401 BELUM_LOGIN seperti token tidak valid; login ulang. Batas percobaan: 5 per menit per IP dan 10 per jam per email (huruf besar dan kecil dianggap sama; percobaan berhasil maupun gagal sama-sama dihitung). Lewat salah satunya dijawab 429 TERLALU_BANYAK_PERCOBAAN dengan header Retry-After."
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: nama@email.com
              password: kata-sandi-anda
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
              example:
                data:
                  token: 1|contoh-token-sanctum
                  user:
                    id: 1
                    nama: Budi Santoso
                    role: user
                  wajib_ganti_password: false
        "401":
          description: Kredensial salah
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Email atau kata sandi salah
                code: KREDENSIAL_SALAH
        "403":
          description: Email belum diverifikasi (EMAIL_BELUM_TERVERIFIKASI) atau akun nonaktif (AKUN_NONAKTIF)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Email belum diverifikasi
                code: EMAIL_BELUM_TERVERIFIKASI
        "429":
          description: Lebih dari 5 percobaan per menit dari satu IP, atau lebih dari 10 per jam untuk satu email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Terlalu banyak percobaan
                code: TERLALU_BANYAK_PERCOBAAN
  /api/v1/auth/logout:
    post:
      tags:
        - Auth
      summary: Logout
      description: Mencabut token saat ini.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Berhasil keluar
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/lupa-password:
    post:
      tags:
        - Auth
      summary: Lupa kata sandi
      description: "Selalu 200 dengan pesan yang sama, email terdaftar atau tidak (anti enumerasi). Bila terdaftar dan aktif, email berisi tautan FRONTEND_URL/reset-password?token=<token>&email=<email> (berlaku 60 menit, sekali pakai) dikirim, dengan token mentah 64 karakter di bawah tautan sebagai cadangan untuk tes di Swagger; token lama akun itu dibatalkan. Maksimal 5 permintaan per menit per IP (429). Di dev (MAIL_MAILER=log) isi email ada di storage/logs/laravel.log: cari baris yang hanya berisi token 64 karakter. Batas: 5 per menit per IP dan 3 per jam per email (huruf besar dan kecil dianggap sama), email terdaftar atau tidak; lewat salah satunya dijawab 429 TERLALU_BANYAK_PERCOBAAN."
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: budi@email.com
              required:
                - email
      responses:
        "200":
          description: Selalu sama
          content:
            application/json:
              schema:
                type: object
              example:
                message: Jika email terdaftar, instruksi reset kata sandi telah dikirim
        "422":
          $ref: "#/components/responses/Validation"
        "429":
          description: Lebih dari 5 permintaan per menit dari satu IP, atau lebih dari 3 per jam untuk satu email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Terlalu banyak percobaan, coba lagi nanti
                code: TERLALU_BANYAK_PERCOBAAN
  /api/v1/auth/reset-password:
    post:
      tags:
        - Auth
      summary: Reset kata sandi dengan token
      description: "Token dari email lupa-password. Berhasil: kata sandi baru disimpan, wajib_ganti_password turun, email dianggap terverifikasi, token reset dihapus, dan SEMUA token login akun dicabut (login ulang). Aturan kata sandi sama dengan register (minimal 8 karakter dan ada angka). Maksimal 5 percobaan per menit per IP (429, hitungan terpisah dari lupa-password). Nama field konfirmasi lama password_confirmation tetap diterima."
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: budi@email.com
                token:
                  type: string
                  example: Zk3x9QmT1vB7nRw2LhY8cUdE5pAfJgS4oXiN6tVyKqMbWrCjHlDeGzPaOuIs0FtX
                password:
                  type: string
                  example: baru12345
                  minLength: 8
                konfirmasi:
                  type: string
                  example: baru12345
              required:
                - email
                - token
                - password
                - konfirmasi
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
              example:
                message: Kata sandi berhasil direset, silakan login
        "422":
          description: "Validasi gagal (kata sandi tidak memenuhi aturan atau konfirmasi tidak cocok), atau token bermasalah: TOKEN_RESET_TIDAK_VALID (token salah, email tidak cocok, atau sudah dipakai) dan TOKEN_RESET_KEDALUWARSA (lewat 60 menit)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                tokenTidakValid:
                  summary: Token salah atau sudah dipakai
                  value:
                    message: Token reset tidak valid
                    code: TOKEN_RESET_TIDAK_VALID
                tokenKedaluwarsa:
                  summary: Token lewat 60 menit
                  value:
                    message: Token reset sudah kedaluwarsa, minta token baru
                    code: TOKEN_RESET_KEDALUWARSA
                validasi:
                  summary: Kata sandi tidak memenuhi aturan
                  value:
                    message: Data yang dikirim tidak valid
                    code: VALIDASI_GAGAL
                    errors:
                      password:
                        - Kata sandi harus mengandung angka
        "429":
          $ref: "#/components/responses/TerlaluBanyak"
  /api/v1/me:
    get:
      tags:
        - Auth
      summary: Data akun yang login
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
              example:
                data:
                  id: 1
                  nama: Budi Santoso
                  email: budi@email.com
                  role: user
                  no_hp: 081234567890
                  provinsi: Jawa Timur
                  kota: Kota Malang
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/profil:
    get:
      tags:
        - Profil
      summary: Lihat profil sendiri
      description: "Semua peran yang sudah login. Tanpa kata sandi dan tanpa no_identitas. Admin hanya punya nama dan email; kolom kontak bernilai null. foto berisi URL foto profil (null bila belum ada); diubah lewat POST /profil."
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
              example:
                data:
                  id: 1
                  nama: Budi Santoso
                  email: budi@email.com
                  role: user
                  no_hp: "081234567890"
                  provinsi: Jawa Timur
                  kota: Kota Malang
                  foto: null
                  email_terverifikasi: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Admin dengan kata sandi sementara (GANTI_PASSWORD_DULU)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Ganti kata sandi sementara Anda terlebih dahulu
                code: GANTI_PASSWORD_DULU
    post:
      tags:
        - Profil
      summary: Ubah profil sendiri (dengan foto opsional)
      description: "multipart/form-data (form), BUKAN JSON, karena PHP tidak membaca PUT multipart; PUT dan PATCH /profil tidak ada lagi (405). Hanya field yang dikirim yang diubah. User: nama, no_hp, provinsi, kota. Admin: hanya nama. Email TIDAK bisa diubah (field email diabaikan), begitu pula no_identitas dan role. Foto: tanpa field foto, foto lama tetap dan tetap muncul di respons; foto baru (jpg, jpeg, png, webp, maks 2 MB) mengganti foto lama dan berkas lama dihapus; hapus_foto=true menghapus foto (menjadi null). Foto disimpan di disk publik dan ditampilkan sebagai URL. Kata sandi diganti lewat PUT /profil/password."
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ProfilForm"
      responses:
        "200":
          description: Berhasil, isi sama dengan GET /profil
          content:
            application/json:
              schema:
                type: object
              example:
                data:
                  id: 1
                  nama: Budi Santoso
                  email: budi@email.com
                  role: user
                  no_hp: "081234567890"
                  provinsi: Jawa Timur
                  kota: Kota Malang
                  foto: http://localhost:8000/storage/profil/1/abc123.jpg
                  email_terverifikasi: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Validation"
  /api/v1/profil/password:
    put:
      tags:
        - Profil
      summary: Ganti kata sandi
      description: "Semua peran. Kata sandi lama harus cocok. Berhasil: token login LAIN milik akun dicabut, token yang sedang dipakai tetap hidup, dan wajib_ganti_password turun. Boleh dipanggil admin dengan kata sandi sementara. Aturan kata sandi baru sama dengan register."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/GantiPassword"
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
              example:
                message: Kata sandi berhasil diganti
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Kata sandi lama salah, kata sandi baru tidak memenuhi aturan, atau konfirmasi tidak cocok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Data yang dikirim tidak valid
                code: VALIDASI_GAGAL
                errors:
                  password_lama:
                    - Kata sandi lama salah
  /api/v1/katalog/tipe:
    get:
      tags:
        - Katalog
      summary: Daftar tipe tersedia menurut tanggal
      description: Tipe dengan sisa_unit 0 tidak ditampilkan.
      security: []
      parameters:
        - name: tgl_mulai
          in: query
          required: true
          schema:
            type: string
          example: "2026-12-10"
          description: Paling cepat besok, paling jauh 30 hari
        - name: durasi
          in: query
          required: true
          schema:
            type: integer
          example: 3
          description: 1 sampai 30
        - name: kursi
          in: query
          required: false
          schema:
            type: string
            enum: ["any", "2", "4", "5", "6", "7", "8", "9"]
            default: any
          description: "Jumlah kursi, atau any untuk semua. Cocok persis (5 hanya tipe 5 kursi). Daftar di sini hanya contoh umum; server menerima angka apa pun, dan frontend sebaiknya mengisi pilihan dari kursi pada daftar tipe yang dikembalikan."
        - name: transmisi
          in: query
          required: false
          schema:
            type: string
            enum: [any, manual, matic]
            default: any
          description: "manual, matic, atau any untuk semua. Tipe tampil bila punya minimal satu unit tersedia dengan transmisi itu."
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
              example:
                data:
                  - id: 1
                    nama: Brio
                    merk: Honda
                    kursi: 5
                    bahan_bakar: bensin
                    tarif: &id001
                      dengan_sopir: 650000
                      lepas_kunci_manual: 300000
                      lepas_kunci_matic: 350000
                    foto: &id002
                      - https://contoh.id/brio-1.jpg
                    rating_rata: 4.8
                    sisa_unit: 2
                  - id: 2
                    nama: Avanza
                    merk: Toyota
                    kursi: 7
                    bahan_bakar: bensin
                    tarif: *id001
                    foto: *id002
                    rating_rata: 4.8
                    sisa_unit: 1
        "422":
          $ref: "#/components/responses/Validation"
  /api/v1/katalog/tipe/{id}:
    get:
      tags:
        - Katalog
      summary: Detail tipe
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
          description: ID tipe
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
              example:
                data:
                  id: 1
                  nama: Brio
                  merk: Honda
                  kursi: 5
                  bahan_bakar: bensin
                  tarif: *id001
                  foto: *id002
                  rating_rata: 4.8
                  sisa_unit: 2
                  spesifikasi:
                    transmisi: manual atau matic
                    bagasi: ukuran sedang
                  review:
                    - nama: Budi
                      rating: 5
                      komentar: Mobil bersih dan nyaman
                      tgl_review: "2026-10-14"
        "404":
          description: Tipe tidak ada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Tipe tidak ditemukan
                code: TIDAK_DITEMUKAN
  /api/v1/info:
    get:
      tags:
        - Katalog
      summary: Info publik
      description: Jam operasional dan data kontak (teks).
      security: []
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
              example:
                data:
                  jam_operasional: 07.00-21.00
                  alamat: Jl. Joyo Agung No. 103, Malang
                  telepon: 0812-3456-7890
                  email: kontak@gantengnyajatim.id
                  batas_antar_gratis: Tlogomas
  /api/v1/pemesanan:
    post:
      tags:
        - Pemesanan (user)
      summary: Buat pesanan
      description: Dibuat dalam database transaction dengan lockForUpdate. Panggilan Midtrans dilakukan di luar transaksi.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/PemesananBuat"
      responses:
        "201":
          description: Pesanan dibuat, menunggu pembayaran
          content:
            application/json:
              schema:
                type: object
              example:
                data:
                  id: 15
                  nomor: PSN-0015
                  status: menunggu_pembayaran
                  tgl_mulai: "2026-12-10"
                  durasi: 3
                  tgl_kembali: "2026-12-12"
                  total_biaya: 900000
                  batas_pembayaran: "2026-11-13T11:40:00+07:00"
                  midtrans:
                    snap_token: mock-snap-token
                    order_id: PSN-0015-1
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: "Unit habis; kode lain: TAGIHAN_BELUM_LUNAS, PESANAN_MENUNGGU_ADA, SOPIR_TIDAK_TERSEDIA"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Mobil sudah dipesan pada tanggal tersebut
                code: UNIT_TIDAK_TERSEDIA
        "422":
          $ref: "#/components/responses/Validation"
        "502":
          description: Gateway pembayaran gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Pembayaran gagal dibuat
                code: PEMBAYARAN_GAGAL
    get:
      tags:
        - Pemesanan (user)
      summary: Daftar pesanan saya
      security:
        - bearerAuth: []
      parameters:
        - name: tab
          in: query
          required: false
          schema:
            type: string
          example: berlangsung
          description: berlangsung atau riwayat
        - &id004
          name: page
          in: query
          schema:
            type: integer
            default: 1
        - &id005
          name: per_page
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
              example:
                data:
                  - id: 15
                    nomor: PSN-0015
                    status: dikonfirmasi
                    tipe:
                      id: 1
                      nama: Brio
                    tgl_mulai: "2026-12-10"
                    durasi: 3
                    total_biaya: 900000
                    aksi_utama: ajukan_pembatalan
                meta:
                  page: 1
                  per_page: 10
                  total: 1
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/pemesanan/{id}:
    get:
      tags:
